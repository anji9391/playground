<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — Free Browser Games</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">▶</span>
        <h1>Playground</h1>
      </div>
      <p class="tagline">20+ games — HTML, CSS &amp; JavaScript. Built for GitHub Pages.</p>
      <p class="stats-bar" id="stats">Loading games…</p>
      <label class="search">
        <span class="sr-only">Search games</span>
        <input id="search" type="search" placeholder="Search chess, snake, carrom…" autocomplete="off" />
      </label>
      <div id="tags" class="tags" role="listbox" aria-label="Filter by tag"></div>
    </header>

    <main>
      <ul id="grid" class="grid" aria-live="polite"></ul>
      <p id="empty" class="empty hidden">No games match your search.</p>
    </main>

    <footer class="footer">
      Copy <code>games/template/</code> · edit <code>games.manifest.json</code> · push to GitHub Pages
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
