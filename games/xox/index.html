<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Neon Tic Tac Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--x:#00bfff;--o:#ff2da0;--board:#7a5cff}
body{
font-family:Poppins,sans-serif;
background:radial-gradient(circle at top,#061838 0%,#020616 60%);
min-height:100vh;display:flex;justify-content:center;align-items:center;
padding:14px;overflow:hidden}
.game-container{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
.logo{text-align:center;margin-bottom:10px}
.logo h1{font-size:3.6rem;color:#fff;letter-spacing:8px}
.lines{display:flex;align-items:center;gap:14px}
.logo p{color:#fff;font-size:.95rem;letter-spacing:4px}
.line{width:65px;height:4px;border-radius:50px}
.blue{background:var(--x);box-shadow:0 0 15px var(--x)}
.pink{background:var(--o);box-shadow:0 0 15px var(--o)}
.score-board{width:100%;display:flex;gap:10px;margin:20px 0}
.score-box{flex:1;height:95px;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(255,255,255,.03)}
.score-box h3{font-size:1.1rem}.score-box span{font-size:2.2rem;font-weight:700}
.x-box{border:3px solid var(--x);color:var(--x);box-shadow:0 0 18px rgba(0,191,255,.35)}
.o-box{border:3px solid var(--o);color:var(--o);box-shadow:0 0 18px rgba(255,45,160,.35)}
.draw-box{border:3px solid rgba(255,255,255,.2);color:#fff}
.turn-box{width:85%;padding:14px;border-radius:20px;margin-bottom:18px;text-align:center;background:rgba(255,255,255,.04);border:2px solid rgba(122,92,255,.4)}
.turn-box h2{font-size:1.5rem;color:var(--x)}
.board{
width:100%;aspect-ratio:1;position:relative;display:grid;
grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
border:4px solid var(--board);border-radius:26px;overflow:hidden;
background:rgba(122,92,255,.08);
box-shadow:0 0 25px rgba(122,92,255,.35), inset 0 0 20px rgba(122,92,255,.15)}
.board::before{
content:"";position:absolute;inset:0;pointer-events:none;
background:
linear-gradient(to right,transparent 32.8%,rgba(122,92,255,.9) 32.8%,rgba(122,92,255,.9) 33.4%,transparent 33.4%,transparent 65.8%,rgba(122,92,255,.9) 65.8%,rgba(122,92,255,.9) 66.4%,transparent 66.4%),
linear-gradient(to bottom,transparent 32.8%,rgba(122,92,255,.9) 32.8%,rgba(122,92,255,.9) 33.4%,transparent 33.4%,transparent 65.8%,rgba(122,92,255,.9) 65.8%,rgba(122,92,255,.9) 66.4%,transparent 66.4%)}
.cell{display:flex;justify-content:center;align-items:center;font-size:4rem;font-weight:700;cursor:pointer;user-select:none;z-index:2}
.cell:active{transform:scale(.95)}
.cell.x{color:var(--x);text-shadow:0 0 18px var(--x)}
.cell.o{color:var(--o);text-shadow:0 0 18px var(--o)}
.buttons{width:100%;margin-top:18px;display:flex;flex-direction:column;gap:14px}
.btn{border:none;padding:18px;border-radius:22px;color:#fff;font-size:1.15rem;font-weight:600}
.new-game{background:linear-gradient(#006eff,#003ea5);border:2px solid #1ec7ff;box-shadow:0 0 20px rgba(0,191,255,.4)}
.reset{background:linear-gradient(#ff007f,#98004b);border:2px solid #ff5ab7;box-shadow:0 0 20px rgba(255,45,160,.35)}
.winner-popup{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:.3s;z-index:999}
.winner-popup.show{opacity:1;visibility:visible}
.popup-card{width:85%;max-width:320px;background:#09162e;border:3px solid #7a5cff;border-radius:30px;padding:35px 25px;text-align:center;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.winner-icon{width:120px;height:120px;margin:auto;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:4rem;font-weight:700;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.winner-icon.x{color:var(--x);border:4px solid var(--x);box-shadow:0 0 30px var(--x)}
.winner-icon.o{color:var(--o);border:4px solid var(--o);box-shadow:0 0 30px var(--o)}
.popup-card h1{color:#fff;margin:16px 0 10px}
.popup-card p{color:#ddd;margin-bottom:18px}
#playAgainBtn{border:none;width:100%;padding:16px;border-radius:20px;background:linear-gradient(to right,#00bfff,#7a5cff);color:#fff;font-size:1.1rem}
</style>
</head>
<body>
<div class="game-container">
<div class="logo"><h1>XOX</h1>
<div class="lines"><div class="line blue"></div><p>TIC TAC TOE</p><div class="line pink"></div></div></div>

<div class="score-board">
<div class="score-box x-box"><h3>X</h3><span id="xScore">0</span></div>
<div class="score-box draw-box"><h3>Draw</h3><span id="drawScore">0</span></div>
<div class="score-box o-box"><h3>O</h3><span id="oScore">0</span></div>
</div>

<div class="turn-box"><h2 id="turnText">X's Turn</h2></div>

<div class="board">
<div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
<div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
<div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
</div>

<div class="buttons">
<button class="btn new-game" id="newGameBtn">New Game</button>
<button class="btn reset" id="resetBtn">Reset Scores</button>
</div>
</div>

<div class="winner-popup" id="winnerPopup">
<div class="popup-card">
<div class="winner-icon" id="winnerIcon">X</div>
<h1>Congratulations!</h1>
<p id="winnerText">X Wins 🎉</p>
<button id="playAgainBtn">Play Again</button>
</div></div>

<script>
const cells=document.querySelectorAll(".cell");
const turnText=document.getElementById("turnText");
const xScoreText=document.getElementById("xScore");
const oScoreText=document.getElementById("oScore");
const drawScoreText=document.getElementById("drawScore");
const winnerPopup=document.getElementById("winnerPopup");
const winnerIcon=document.getElementById("winnerIcon");
const winnerText=document.getElementById("winnerText");
const playAgainBtn=document.getElementById("playAgainBtn");
const newGameBtn=document.getElementById("newGameBtn");
const resetBtn=document.getElementById("resetBtn");

let board=["","","","","","","","",""], currentPlayer="X", gameActive=true;
let xScore=0,oScore=0,drawScore=0;

const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function updateTurn(){
turnText.textContent=currentPlayer+"'s Turn";
turnText.style.color=currentPlayer==="X"?"#00bfff":"#ff2da0";
}

function showWinnerPopup(player){
winnerPopup.classList.add("show");
winnerIcon.textContent=player;
winnerIcon.className="winner-icon "+player.toLowerCase();
winnerText.textContent=player+" Wins The Match! 🎉";
}

function checkWinner(){
for(const [a,b,c] of wins){
if(board[a]&&board[a]===board[b]&&board[a]===board[c]){
gameActive=false;
if(board[a]==="X"){xScore++;xScoreText.textContent=xScore;}
else{oScore++;oScoreText.textContent=oScore;}
turnText.textContent=board[a]+" Wins 🎉";
showWinnerPopup(board[a]);
return;
}}
if(!board.includes("")){
gameActive=false;
drawScore++;
drawScoreText.textContent=drawScore;
turnText.textContent="Draw 🤝";
}
}

cells.forEach(cell=>{
cell.addEventListener("click",()=>{
const index=cell.dataset.index;
if(board[index]||!gameActive)return;
board[index]=currentPlayer;
cell.textContent=currentPlayer;
cell.classList.add(currentPlayer.toLowerCase());
checkWinner();
if(gameActive){
currentPlayer=currentPlayer==="X"?"O":"X";
updateTurn();
}
});
});

function resetBoard(){
board=["","","","","","","","",""];
gameActive=true;
currentPlayer="X";
cells.forEach(c=>{c.textContent="";c.classList.remove("x","o");});
updateTurn();
}

playAgainBtn.addEventListener("click",()=>{
winnerPopup.classList.remove("show");
resetBoard();
});
newGameBtn.addEventListener("click",resetBoard);
resetBtn.addEventListener("click",()=>{
xScore=oScore=drawScore=0;
xScoreText.textContent=0;
oScoreText.textContent=0;
drawScoreText.textContent=0;
winnerPopup.classList.remove("show");
resetBoard();
});
updateTurn();
</script>
</body>
</html>
