<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Neon Tic Tac Toe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

:root{
    --x:#00bfff;
    --o:#ff2da0;
    --board:#7a5cff;
}

body{
    font-family:'Poppins',sans-serif;
    background: radial-gradient(circle at top,#061838 0%,#020616 60%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow-x:hidden;
}

.game-container{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* TITLE */

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo h1{
    font-size:4rem;
    color:#fff;
    letter-spacing:8px;
    font-weight:700;
}

.lines{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
}

.logo p{
    color:white;
    letter-spacing:4px;
    font-size:1rem;
}

.line{
    width:70px;
    height:4px;
    border-radius:50px;
}

.line.blue{
    background:var(--x);
    box-shadow:0 0 15px var(--x);
}

.line.pink{
    background:var(--o);
    box-shadow:0 0 15px var(--o);
}

/* SCORE */

.score-board{
    width:100%;
    display:flex;
    gap:12px;
    margin:25px 0;
}

.score-box{
    flex:1;
    height:105px;
    border-radius:24px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,0.03);
}

.score-box h3{
    font-size:1.2rem;
}

.score-box span{
    font-size:2.6rem;
    font-weight:700;
}

.x-box{
    border:3px solid var(--x);
    box-shadow:0 0 18px rgba(0,191,255,.4);
    color:var(--x);
}

.draw-box{
    border:3px solid rgba(255,255,255,.2);
    color:#fff;
}

.o-box{
    border:3px solid var(--o);
    box-shadow:0 0 18px rgba(255,45,160,.35);
    color:var(--o);
}

/* TURN */

.turn-box{
    width:85%;
    text-align:center;
    padding:16px;
    border-radius:22px;
    margin-bottom:22px;
    border:2px solid rgba(122,92,255,.4);
    background:rgba(255,255,255,.03);
}

.turn-box h2{
    color:var(--x);
    font-size:1.9rem;
}

/* BOARD */

.board{
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border:4px solid var(--board);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(122,92,255,.35);
}

.cell{
    border:2px solid rgba(122,92,255,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:4.8rem;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.cell:active{
    transform:scale(.95);
}

.cell.x{
    color:var(--x);
    text-shadow:0 0 20px var(--x);
}

.cell.o{
    color:var(--o);
    text-shadow:0 0 20px var(--o);
}

/* BUTTONS */

.buttons{
    width:100%;
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    border:none;
    padding:20px;
    border-radius:22px;
    color:#fff;
    font-size:1.3rem;
    font-weight:600;
    cursor:pointer;
}

.btn:active{
    transform:scale(.97);
}

.new-game{
    background:linear-gradient(to bottom,#006eff,#003ea5);
    border:2px solid #1ec7ff;
    box-shadow:0 0 20px rgba(0,191,255,.4);
}

.reset{
    background:linear-gradient(to bottom,#ff007f,#98004b);
    border:2px solid #ff5ab7;
    box-shadow:0 0 20px rgba(255,45,160,.35);
}

/* MOBILE */

@media(max-width:450px){

.logo h1{
    font-size:3.3rem;
}

.cell{
    font-size:4rem;
}

.turn-box h2{
    font-size:1.5rem;
}

.btn{
    font-size:1.15rem;
}
}
</style>
</head>

<body>

<div class="game-container">

<div class="logo">
<h1>XOX</h1>

<div class="lines">
<div class="line blue"></div>
<p>TIC TAC TOE</p>
<div class="line pink"></div>
</div>
</div>

<div class="score-board">
<div class="score-box x-box">
<h3>X</h3>
<span id="xScore">0</span>
</div>

<div class="score-box draw-box">
<h3>Draw</h3>
<span id="drawScore">0</span>
</div>

<div class="score-box o-box">
<h3>O</h3>
<span id="oScore">0</span>
</div>
</div>

<div class="turn-box">
<h2 id="turnText">X's Turn</h2>
</div>

<div class="board">
<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>
<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>
<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>
</div>

<div class="buttons">
<button class="btn new-game" id="newGameBtn">
New Game
</button>

<button class="btn reset" id="resetBtn">
Reset Scores
</button>
</div>

</div>

<script>
const cells = document.querySelectorAll(".cell");
const turnText = document.getElementById("turnText");

const xScoreText = document.getElementById("xScore");
const oScoreText = document.getElementById("oScore");
const drawScoreText = document.getElementById("drawScore");

const newGameBtn = document.getElementById("newGameBtn");
const resetBtn = document.getElementById("resetBtn");

let board = ["","","","","","","","",""];
let currentPlayer = "X";
let gameActive = true;

let xScore = 0;
let oScore = 0;
let drawScore = 0;

const winPatterns = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

function updateTurn(){
    turnText.textContent = currentPlayer + "'s Turn";
    turnText.style.color =
    currentPlayer === "X"
    ? "#00bfff"
    : "#ff2da0";
}

function checkWinner(){
    for(let pattern of winPatterns){

        let [a,b,c] = pattern;

        if(
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ){
            gameActive = false;

            if(board[a] === "X"){
                xScore++;
                xScoreText.textContent = xScore;
            } else {
                oScore++;
                oScoreText.textContent = oScore;
            }

            turnText.textContent =
            board[a] + " Wins 🎉";

            return;
        }
    }

    if(!board.includes("")){
        drawScore++;
        drawScoreText.textContent = drawScore;
        turnText.textContent = "Draw 🤝";
        gameActive = false;
    }
}

cells.forEach(cell => {
    cell.addEventListener("click", () => {

        const index = cell.dataset.index;

        if(board[index] || !gameActive) return;

        board[index] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());

        checkWinner();

        if(gameActive){
            currentPlayer =
            currentPlayer === "X" ? "O" : "X";
            updateTurn();
        }
    });
});

function resetBoard(){
    board = ["","","","","","","","",""];
    gameActive = true;
    currentPlayer = "X";

    cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("x","o");
    });

    updateTurn();
}

newGameBtn.addEventListener("click", resetBoard);

resetBtn.addEventListener("click", () => {
    xScore = 0;
    oScore = 0;
    drawScore = 0;

    xScoreText.textContent = 0;
    oScoreText.textContent = 0;
    drawScoreText.textContent = 0;

    resetBoard();
});

updateTurn();
</script>

</body>
</html>
