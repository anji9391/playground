<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Tap Dash</title>
    <link rel="stylesheet" href="../../shared/game-shell.css" />
    <style>
      body { background: #431407; }
    </style>
  </head>
  <body class="has-hud">
    <div class="game-bar">
      <a href="../../index.html">← Lobby</a>
      <span class="title">Tap Dash</span>
      <span class="score" id="score">0</span>
    </div>
    <div class="controls-bar" data-game-hud></div>
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay">
      <h2>Tap Dash</h2>
      <p>Tap, click, or press Space to jump. Dodge the blocks.</p>
      <button type="button" class="btn btn-primary" id="start">Start</button>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
