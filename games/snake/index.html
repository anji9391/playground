<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Classic Snake</title>
    <link rel="stylesheet" href="../../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="has-hud">
    <div class="game-bar">
      <a href="../../index.html">← Lobby</a>
      <span class="title">Classic Snake</span>
      <span class="score" id="score">0</span>
    </div>
    <div class="controls-bar" data-game-hud></div>
    <div class="snake-wrap">
      <canvas id="game" width="400" height="400"></canvas>
    </div>
    <p class="hint">Arrow keys or WASD · P to pause</p>
    <div id="overlay" class="overlay hidden">
      <h2>Game Over</h2>
      <p id="overlay-msg">You crashed!</p>
      <button type="button" class="btn btn-primary" id="restart">Play again</button>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
