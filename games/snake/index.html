<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Snake X Mobile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:
    linear-gradient(
    135deg,
    #07111d,
    #10251c
    );

    color:white;

    position:fixed;
    inset:0;

    touch-action:none;
    overscroll-behavior:none;

    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.container{
    width:100%;
    max-width:500px;
    height:100dvh;

    display:flex;
    flex-direction:column;

    padding:8px;
}

.logo{
    text-align:center;
    margin-bottom:8px;
}

.logo h1{
    color:#77ff99;
    font-size:1.7rem;
}

.logo p{
    color:#b9b9b9;
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    gap:8px;
    margin-bottom:10px;
}

.card{
    background:#182434;
    border-radius:12px;
    padding:8px;
    text-align:center;
}

.card h3{
    color:#77ff99;
    font-size:11px;
    margin-bottom:4px;
}

.card span{
    font-size:16px;
    font-weight:bold;
}

.game-wrapper{
    flex:1;
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    background:
    linear-gradient(
    180deg,
    #14311f,
    #0a1711
    );

    border:4px solid #4ee276;
    border-radius:18px;

    max-width:100%;
    max-height:100%;

    display:block;
}

.overlay{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    pointer-events:none;
}

.hidden{
    display:none;
}

.popup{
    background:
    rgba(18,28,39,.92);

    padding:20px;
    border-radius:18px;
    text-align:center;
}

.popup h2{
    margin-bottom:8px;
}

.popup p{
    margin-bottom:14px;
}

button{
    border:none;
    background:#59e580;
    color:black;
    font-weight:bold;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    pointer-events:auto;
}

.controls{
    margin-top:10px;
}

.controls .top{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
}

.controls .bottom{
    display:flex;
    justify-content:center;
    gap:14px;
}

.ctrl{
    width:65px;
    height:65px;

    border:none;
    border-radius:16px;

    background:#182434;
    color:white;
    font-size:28px;
}

@media(min-width:768px){

    .container{
        max-width:900px;
        padding:20px;
    }

    .logo h1{
        font-size:2.3rem;
    }

    .stats{
        display:flex;
        justify-content:center;
        gap:14px;
    }

    .card{
        min-width:120px;
    }

    .controls{
        display:none;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<h1>🐍 Snake X</h1>
<p>Mobile Optimized Edition</p>
</div>

<div class="stats">

<div class="card">
<h3>Score</h3>
<span id="score">0</span>
</div>

<div class="card">
<h3>High</h3>
<span id="highScore">0</span>
</div>

<div class="card">
<h3>Level</h3>
<span id="level">1</span>
</div>

<div class="card">
<h3>Speed</h3>
<span id="speedText">1x</span>
</div>

</div>

<div class="game-wrapper">

<canvas id="gameCanvas"></canvas>

<div
id="startScreen"
class="overlay">

<div class="popup">
<h2>🐍 Snake X</h2>
<p>Swipe or use controls</p>
</div>

</div>

<div
id="gameOver"
class="overlay hidden">

<div class="popup">

<h2>💀 Game Over</h2>

<p id="finalScore">
Score: 0
</p>

<button
onclick="restartGame()">

Play Again

</button>

</div>
</div>

</div>

<div class="controls">

<div class="top">

<button
class="ctrl"
onclick="setDirection('UP')">
⬆
</button>

</div>

<div class="bottom">

<button
class="ctrl"
onclick="setDirection('LEFT')">
⬅
</button>

<button
class="ctrl"
onclick="setDirection('DOWN')">
⬇
</button>

<button
class="ctrl"
onclick="setDirection('RIGHT')">
➡
</button>

</div>
</div>

<script>
const canvas =
document.getElementById(
"gameCanvas"
);

const ctx =
canvas.getContext("2d");

const scoreEl =
document.getElementById(
"score"
);

const highScoreEl =
document.getElementById(
"highScore"
);

const levelEl =
document.getElementById(
"level"
);

const speedText =
document.getElementById(
"speedText"
);

const startScreen =
document.getElementById(
"startScreen"
);

const gameOver =
document.getElementById(
"gameOver"
);

const finalScore =
document.getElementById(
"finalScore"
);

const box = 20;

let snake = [];
let direction = "RIGHT";
let food = {};

let score = 0;
let level = 1;
let speed = 140;
let game = null;
let started = false;

const fruits = [
{emoji:"🍎",points:1},
{emoji:"🍌",points:2},
{emoji:"🍇",points:3},
{emoji:"🍓",points:2}
];

const eatSound =
new Audio(
"https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
);

const gameOverSound =
new Audio(
"https://assets.mixkit.co/active_storage/sfx/2220/2220-preview.mp3"
);

const levelSound =
new Audio(
"https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"
);

eatSound.volume=.2;
gameOverSound.volume=.3;
levelSound.volume=.2;

function resizeCanvas(){

const mobile =
window.innerWidth < 768;

let size;

if(mobile){

size = Math.min(
window.innerWidth - 20,
window.innerHeight - 320
);

}else{

size = Math.min(
window.innerWidth * .55,
window.innerHeight * .7,
700
);
}

size =
Math.floor(size / box)
* box;

canvas.width = size;
canvas.height = size;
}
window.addEventListener(
"resize",
resizeCanvas
);

function createFood(){

let x,y;

do{

x =
Math.floor(
Math.random() *
(canvas.width / box)
) * box;

y =
Math.floor(
Math.random() *
(canvas.height / box)
) * box;

}while(
snake.some(
s =>
s.x===x &&
s.y===y
)
);

const fruit =
fruits[
Math.floor(
Math.random() *
fruits.length
)
];

return{
x,
y,
emoji:fruit.emoji,
points:fruit.points
};
}

function startGame(){

resizeCanvas();

snake = [
{x:box*5,y:box*5}
];

direction = "RIGHT";

score = 0;
level = 1;
speed = 140;

scoreEl.textContent =
score;

levelEl.textContent =
level;

speedText.textContent =
"1x";

food =
createFood();

startScreen.classList.add(
"hidden"
);

gameOver.classList.add(
"hidden"
);

started = true;

clearInterval(game);

game =
setInterval(
draw,
speed
);
}

function restartGame(){
startGame();
}

function setDirection(dir){

if(
dir==="LEFT" &&
direction!=="RIGHT"
){
direction="LEFT";
}

if(
dir==="RIGHT" &&
direction!=="LEFT"
){
direction="RIGHT";
}

if(
dir==="UP" &&
direction!=="DOWN"
){
direction="UP";
}

if(
dir==="DOWN" &&
direction!=="UP"
){
direction="DOWN";
}

if(!started){
startGame();
}
}

document.addEventListener(
"keydown",
e=>{

const key =
e.key.toLowerCase();

if(
["arrowup","w"]
.includes(key)
){
setDirection("UP");
}

if(
["arrowdown","s"]
.includes(key)
){
setDirection("DOWN");
}

if(
["arrowleft","a"]
.includes(key)
){
setDirection("LEFT");
}

if(
["arrowright","d"]
.includes(key)
){
setDirection("RIGHT");
}

});

let startX = 0;
let startY = 0;

canvas.addEventListener(
"touchstart",
e=>{

e.preventDefault();

startX =
e.touches[0].clientX;

startY =
e.touches[0].clientY;

},
{passive:false}
);

canvas.addEventListener(
"touchmove",
e=>{

e.preventDefault();

const dx =
e.touches[0].clientX
- startX;

const dy =
e.touches[0].clientY
- startY;

if(
Math.abs(dx) >
Math.abs(dy)
){

if(
dx > 15 &&
direction!=="LEFT"
){

setDirection(
"RIGHT"
);

startX =
e.touches[0]
.clientX;
}

if(
dx < -15 &&
direction!=="RIGHT"
){

setDirection(
"LEFT"
);

startX =
e.touches[0]
.clientX;
}

}else{

if(
dy > 15 &&
direction!=="UP"
){

setDirection(
"DOWN"
);

startY =
e.touches[0]
.clientY;
}

if(
dy < -15 &&
direction!=="DOWN"
){

setDirection(
"UP"
);

startY =
e.touches[0]
.clientY;
}
}

},
{passive:false}
);

function drawGrid(){

ctx.strokeStyle =
"rgba(255,255,255,.03)";

for(
let i=0;
i<canvas.width;
i+=box
){

ctx.beginPath();
ctx.moveTo(i,0);
ctx.lineTo(
i,
canvas.height
);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,i);
ctx.lineTo(
canvas.width,
i
);
ctx.stroke();
}
}

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawGrid();

ctx.font =
"20px Arial";

ctx.fillText(
food.emoji,
food.x + 2,
food.y + 18
);

snake.forEach(
(part,index)=>{

ctx.beginPath();

ctx.roundRect(
part.x,
part.y,
box,
box,
7
);

ctx.fillStyle =
index===0
? "#98ff78"
: "#44d860";

ctx.fill();

if(index===0){

ctx.fillStyle =
"black";

ctx.beginPath();

ctx.arc(
part.x+6,
part.y+7,
2,
0,
Math.PI*2
);

ctx.arc(
part.x+14,
part.y+7,
2,
0,
Math.PI*2
);

ctx.fill();
}
});

let snakeX =
snake[0].x;

let snakeY =
snake[0].y;

if(direction==="LEFT")
snakeX -= box;

if(direction==="RIGHT")
snakeX += box;

if(direction==="UP")
snakeY -= box;

if(direction==="DOWN")
snakeY += box;

if(
snakeX===food.x &&
snakeY===food.y
){

score +=
food.points;

eatSound.currentTime =
0;

eatSound.play();

scoreEl.textContent =
score;

food =
createFood();

if(score % 5===0){

level++;

levelSound.play();

levelEl.textContent =
level;

if(speed > 60){

speed -= 6;

speedText.textContent =
`${level}x`;

clearInterval(
game
);

game =
setInterval(
draw,
speed
);
}
}

}else{
snake.pop();
}

const head = {
x:snakeX,
y:snakeY
};

if(

snakeX < 0 ||
snakeY < 0 ||

snakeX >=
canvas.width ||

snakeY >=
canvas.height ||

snake.some(
part =>
part.x===snakeX &&
part.y===snakeY
)

){

clearInterval(game);

gameOverSound.play();

started = false;

const highScore =
Math.max(
score,
Number(
localStorage.getItem(
"snakeHighScore"
) || 0
)
);

localStorage.setItem(
"snakeHighScore",
highScore
);

highScoreEl.textContent =
highScore;

finalScore.textContent =
`Score: ${score}`;

gameOver.classList.remove(
"hidden"
);

return;
}

snake.unshift(head);
}

resizeCanvas();
</script>

</body>
</html>
