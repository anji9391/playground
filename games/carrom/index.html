<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Carrom Board</title>
    <link rel="stylesheet" href="../../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="has-hud">
    <div class="game-bar">
      <a href="../../index.html">← Lobby</a>
      <span class="title">Carrom Board</span>
      <span class="score" id="barScore">0</span>
    </div>
    <div class="controls-bar" data-game-hud></div>
    <canvas id="game"></canvas>
    <p class="hint">Drag striker · release to shoot · pocket all coins + queen</p>
    <div id="overlay" class="overlay hidden">
      <h2>Excellent shot!</h2>
      <p>All pieces pocketed. Play again?</p>
      <button type="button" class="btn btn-primary" id="restart">Play again</button>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
