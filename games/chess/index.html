<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Chess</title>

    <link rel="stylesheet" href="../../shared/game-shell.css" />

    <link rel="stylesheet" href="style.css" />

  </head>

  <body class="has-hud">

    <div class="game-bar">

      <a href="../../index.html">← Lobby</a>

      <span class="title">Chess</span>

      <span class="score" id="status">White to move</span>

    </div>

    <div class="controls-bar" data-game-hud></div>

    <div class="game-main chess-app">

      <div class="board-wrap">

        <div id="board" class="chess-board"></div>

      </div>

      <div class="side-panel">

        <p id="message">Select a piece to move.</p>

        <button type="button" class="btn btn-primary" id="newGame">New game</button>

        <button type="button" class="btn btn-ghost" id="flipBoard">Flip board</button>

      </div>

    </div>

    <script type="module" src="game.js"></script>

  </body>

</html>
